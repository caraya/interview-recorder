services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fieldnote
      POSTGRES_PASSWORD: fieldnote_dev
      POSTGRES_DB: fieldnote
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fieldnote_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldnote -d fieldnote"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fieldnote_postgres:
